general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Preserve the current level where the kernel exposes it. The Legion's binary
# interface is skipped because it cannot distinguish physical low/high levels.
listener {
    timeout = 60
    on-timeout = ~/.config/eww/scripts/keyboard-idle.sh off
    on-resume = ~/.config/eww/scripts/keyboard-idle.sh restore
}

# Battery display off at ten minutes. On AC this command deliberately does nothing.
listener {
    timeout = 600
    on-timeout = ~/.local/bin/pendash-idle-action battery-display
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Lock after five minutes on both power sources.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Battery suspends after one hour; AC only powers off the display.
listener {
    timeout = 3600
    on-timeout = ~/.local/bin/pendash-idle-action final
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
